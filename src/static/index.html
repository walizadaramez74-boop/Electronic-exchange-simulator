<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Electronic Exchange Simulator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px;
        background: #0f172a;
        color: #e2e8f0;
    }

    h1 {
        margin-bottom: 6px;
    }

    h2 {
        margin-top: 32px;
        border-bottom: 1px solid #334155;
        padding-bottom: 8px;
    }

    h3 {
        margin-bottom: 10px;
    }

    p {
        color: #cbd5e1;
    }

    form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
        padding: 20px;
        background: #1e293b;
        border-radius: 10px;
    }

    label {
        font-size: 14px;
        font-weight: bold;
    }

    select,
    input,
    button {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #475569;
        font-size: 14px;
    }

    select,
    input {
        background: #0f172a;
        color: #e2e8f0;
    }

    button {
        background: #e2e8f0;
        color: #0f172a;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    #best-bid,
    #best-ask {
        font-size: 18px;
    }

    #bids,
    #asks,
    #trades {
        background: #1e293b;
        padding: 16px;
        border-radius: 8px;
        min-height: 60px;
    }

    #bids p,
    #asks p,
    #trades p {
        margin: 6px 0;
        font-family: monospace;
    }

.management-panel {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 16px;
    padding: 20px;
    background: #1e293b;
    border-radius: 10px;
}

.management-panel div {
    display: flex;
    gap: 10px;
    align-items: end;
}

#status-message {
    min-height: 20px;
    font-family: monospace;
}
</style>
</head>

<body>

    <h1>Electronic Exchange Simulator</h1>

    <p>
        Interactive limit-order-book simulator built with Python and FastAPI.
    </p>

    <h2>Submit Order</h2>

    <form id="order-form">

        <label for="side">Side:</label>
        <select id="side">
            <option value="BUY">Buy</option>
            <option value="SELL">Sell</option>
        </select>

        <label for="order-type">Order Type:</label>
        <select id="order-type">
            <option value="LIMIT">Limit</option>
            <option value="MARKET">Market</option>
        </select>

        <label for="quantity">Quantity:</label>
        <input
            id="quantity"
            type="number"
            min="1"
            required
        >

        <label for="price">Price:</label>
        <input
            id="price"
            type="number"
            step="0.01"
            min="0"
        >

        <button type="submit">
            Submit Order
        </button>

    </form>
<h2>Manage Orders</h2>

<div class="management-panel">
    <div>
        <label for="cancel-order-id">Order ID:</label>
        <input
            id="cancel-order-id"
            type="number"
            min="1"
            placeholder="e.g. 3"
        >

        <button id="cancel-order-button">
            Cancel Order
        </button>
    </div>

    <button id="reset-button">
        Reset Exchange
    </button>
</div>

<p id="status-message"></p>
    <h2>Market</h2>

    <p>
        Best Bid:
        <strong id="best-bid">-</strong>
    </p>

    <p>
        Best Ask:
        <strong id="best-ask">-</strong>
    </p>

    <h2>Order Book</h2>

    <div>
        <h3>Bids</h3>
        <div id="bids"></div>
    </div>

    <div>
        <h3>Asks</h3>
        <div id="asks"></div>
    </div>

    <h2>Trades</h2>

    <div id="trades"></div>

<script>
    const form = document.getElementById("order-form");
    const sideInput = document.getElementById("side");
    const orderTypeInput = document.getElementById("order-type");
    const quantityInput = document.getElementById("quantity");
    const priceInput = document.getElementById("price");

    const bestBid = document.getElementById("best-bid");
    const bestAsk = document.getElementById("best-ask");
    const bidsContainer = document.getElementById("bids");
    const asksContainer = document.getElementById("asks");
    const tradesContainer = document.getElementById("trades");
const cancelOrderInput =
    document.getElementById("cancel-order-id");

const cancelOrderButton =
    document.getElementById("cancel-order-button");

const resetButton =
    document.getElementById("reset-button");

const statusMessage =
    document.getElementById("status-message");

    function updatePriceInput() {
        if (orderTypeInput.value === "MARKET") {
            priceInput.value = "";
            priceInput.disabled = true;
        } else {
            priceInput.disabled = false;
        }
    }


    async function submitOrder(event) {
        event.preventDefault();

        const orderType = orderTypeInput.value;

        const order = {
            side: sideInput.value,
            order_type: orderType,
            quantity: Number(quantityInput.value),
            price:
                orderType === "LIMIT"
                    ? Number(priceInput.value)
                    : null
        };

        const response = await fetch("/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(order)
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.detail || "Order could not be submitted.");
            return;
        }

        console.log("Order response:", result);

        quantityInput.value = "";

        if (orderType === "LIMIT") {
            priceInput.value = "";
        }

        await refreshMarket();
    }


    async function loadOrderBook() {
        const response = await fetch("/orderbook");
        const data = await response.json();

        bestBid.textContent =
            data.best_bid === null
                ? "-"
                : data.best_bid.toFixed(2);

        bestAsk.textContent =
            data.best_ask === null
                ? "-"
                : data.best_ask.toFixed(2);

        bidsContainer.innerHTML = "";
        asksContainer.innerHTML = "";

        if (data.bids.length === 0) {
            bidsContainer.innerHTML = "<p>No bids</p>";
        } else {
            for (const level of data.bids) {
                const row = document.createElement("p");

                row.textContent =
                    `${level.total_quantity} @ ${level.price.toFixed(2)}`;

                bidsContainer.appendChild(row);
            }
        }

        if (data.asks.length === 0) {
            asksContainer.innerHTML = "<p>No asks</p>";
        } else {
            for (const level of data.asks) {
                const row = document.createElement("p");

                row.textContent =
                    `${level.total_quantity} @ ${level.price.toFixed(2)}`;

                asksContainer.appendChild(row);
            }
        }
    }


    async function loadTrades() {
        const response = await fetch("/trades");
        const trades = await response.json();

        tradesContainer.innerHTML = "";

        if (trades.length === 0) {
            tradesContainer.innerHTML = "<p>No trades yet</p>";
            return;
        }

        for (const trade of trades.slice().reverse()) {
            const row = document.createElement("p");

            row.textContent =
                `${trade.quantity} @ ${trade.price.toFixed(2)} ` +
                `(Buy #${trade.buy_order_id}, Sell #${trade.sell_order_id})`;

            tradesContainer.appendChild(row);
        }
    }

async function cancelOrder() {
    const orderId = Number(cancelOrderInput.value);

    if (!orderId) {
        statusMessage.textContent =
            "Enter an order ID to cancel.";
        return;
    }

    const response = await fetch(`/orders/${orderId}`, {
        method: "DELETE"
    });

    const result = await response.json();

    if (!response.ok) {
        statusMessage.textContent =
            result.detail || "Order could not be cancelled.";
        return;
    }

    statusMessage.textContent =
        `Order #${orderId} cancelled.`;

    cancelOrderInput.value = "";

    await refreshMarket();
}


async function resetExchange() {
    const response = await fetch("/reset", {
        method: "POST"
    });

    const result = await response.json();

    statusMessage.textContent =
        result.status;

    await refreshMarket();
}
    async function refreshMarket() {
        await loadOrderBook();
        await loadTrades();
    }


    form.addEventListener("submit", submitOrder);
cancelOrderButton.addEventListener(
    "click",
    cancelOrder
);

resetButton.addEventListener(
    "click",
    resetExchange
);
    orderTypeInput.addEventListener(
        "change",
        updatePriceInput
    );

    updatePriceInput();
    refreshMarket();
</script>

</body>
</html>
